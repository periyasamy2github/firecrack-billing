name: Deploy to GitHub Pages

# Publishes the built site to the gh-pages branch, which GitHub Pages serves.
# (actions/configure-pages can't turn Pages on with the default token, so the
# branch route is the one that works without changing repository settings.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Pages has no SPA rewrite rule, so a deep link like /bills would 404.
      # Serving the same app as 404.html lets the client-side router take over.
      - run: cp dist/index.html dist/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
